runs:
  using: 'composite'
  steps:
    - name: 'PHP lint'
      run: |
        trap 'echo' EXIT
        printf '\n### %s\n' 'PHP lint'
        find *.php Classes Configuration Tests -name '*.php' -print0 | xargs -0 -n 1 -P 4 php -d display_errors=stderr -d log_errors=0 -l > /dev/null && echo "$(find *.php Classes Configuration Tests -name '*.php' | wc -l) files without syntax errors"

    - name: 'Rector'
      run: |
        trap 'echo' EXIT
        printf '\n### %s\n' 'Rector'
        ./vendor/bin/rector process --dry-run

    - name: 'Code Quality (by PHPStan)'
      run: |
        trap 'echo' EXIT
        printf '\n### %s\n' 'Code Quality (by PHPStan)'
        ./vendor/bin/phpstan analyse

    - name: 'PHPUnit Tests'
      run: |
        trap 'echo' EXIT
        printf '\n### %s\n' 'PHPUnit Tests'
        XDEBUG_MODE=off ./vendor/bin/paratest --runner=WrapperRunner --display-all-issues
