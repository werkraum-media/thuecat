name: 'Mutation testing'

# After a merge: the full mutation run repeats the whole suite for coverage and
# checks the totals against Build/quality-baseline.json.
'on':
  push:
    branches:
      - 'main'

jobs:
  mutation-full:
    runs-on: 'typo3'
    container:
      image: 'forgejo.werkraum-media.de/global/typo3-ci:php84-node24'
    steps:
      - uses: 'actions/checkout@v6'

      - uses: './.forgejo/local-actions/setup'
        with:
          php-version: '84'
          typo3-version: '^14.3'

      - uses: './.forgejo/local-actions/coverage'

      - name: 'Full mutation run and baseline check'
        run: |
          trap 'echo' EXIT
          printf '\n### %s\n' 'Full mutation run and baseline check'
          Build/Scripts/infection.sh --full
