name: 'CI'

# The full mutation run after a merge lives in mutation-full.yaml.
'on':
  pull_request:

jobs:
  base-qa:
    runs-on: 'typo3'
    container:
      image: 'forgejo.werkraum-media.de/global/typo3-ci:php84-node24'
    steps:
      - uses: 'actions/checkout@v6'

      - uses: 'actions/local/qa-forgejo-folder@v1'

      - uses: 'actions/local/setup-composer-cache@v1'

      - name: 'Validate composer.json'
        run: |
          trap 'echo' EXIT
          printf '\n### %s\n' 'Validate composer.json'
          composer validate

      - name: 'Validate TYPO3 language files'
        run: |
          trap 'echo' EXIT
          printf '\n### %s\n' 'Validate TYPO3 language files'
          xmllint --schema xliff-core-1.2-strict.xsd --noout $(find Resources -name '*.xlf')

      - name: 'Install dependencies'
        run: |
          trap 'echo' EXIT
          printf '\n### %s\n' 'Install dependencies'
          composer install --no-progress --no-interaction --no-ansi

      - name: 'Validate PHPUnit configuration file'
        run: |
          trap 'echo' EXIT
          printf '\n### %s\n' 'Validate PHPUnit configuration file'
          xmllint --schema vendor/phpunit/phpunit/phpunit.xsd --noout phpunit.xml.dist

      - name: 'Coding Guideline'
        run: |
          trap 'echo' EXIT
          printf '\n### %s\n' 'Coding Guideline'
          ./vendor/bin/php-cs-fixer fix --dry-run --diff

  advanced-qa:
    runs-on: 'typo3'
    container:
      image: 'forgejo.werkraum-media.de/global/typo3-ci:php${{ matrix.php-version }}-node24'
    needs:
      - 'base-qa'
    strategy:
      matrix:
        php-version:
          - '84'
          - '85'
        typo3-version:
          - '^14.3'
    steps:
      - uses: 'actions/checkout@v6'

      - uses: './.forgejo/local-actions/setup'
        with:
          php-version: '${{ matrix.php-version }}'
          typo3-version: '${{ matrix.typo3-version }}'

      - uses: './.forgejo/local-actions/advanced-qa'

  mutation-gate:
    runs-on: 'typo3'
    container:
      image: 'forgejo.werkraum-media.de/global/typo3-ci:php84-node24'
    needs:
      - 'advanced-qa'
    steps:
      # The gate diffs against origin/main.
      - uses: 'actions/checkout@v6'
        with:
          fetch-depth: 0

      - uses: './.forgejo/local-actions/setup'
        with:
          php-version: '84'
          typo3-version: '^14.3'

      - uses: './.forgejo/local-actions/coverage'

      - name: 'Mutation gate for the changed lines'
        run: |
          trap 'echo' EXIT
          printf '\n### %s\n' 'Mutation gate for the changed lines'
          Build/Scripts/infection.sh
