<html
        xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
        data-namespace-typo3-fluid="true"
>
<h2><f:link.action action="show" arguments="{attraction: attraction}" pageUid="{settings.page.pid.thuecat_attraction_show}">{attraction.title}</f:link.action></h2>
<p>{attraction.description}</p>
<f:if condition="{attraction.firstAddress}">
    <f:render partial="Address/Summary" arguments="{address: attraction.firstAddress}" />
</f:if>
<f:if condition="{attraction.recordType} == 'meeting_venue'">
    <f:render partial="TouristAttraction/MeetingVenueListItem" arguments="{venue: attraction}" />
</f:if>
</html>
