<html
        xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
        data-namespace-typo3-fluid="true"
>
<f:if condition="{attraction.categories -> f:count()}">
    <section data-relation="categories">
        <h3><f:translate key="content.categories" extensionName="thuecat" /></h3>
        <ul>
            <f:for each="{attraction.categories}" as="category">
                <li class="category">{category.title -> f:format.htmlspecialchars()}</li>
            </f:for>
        </ul>
    </section>
</f:if>
<f:if condition="{attraction.keywords -> f:count()}">
    <section data-relation="keywords">
        <h3><f:translate key="content.keywords" extensionName="thuecat" /></h3>
        <ul>
            <f:for each="{attraction.keywords}" as="keyword">
                <li class="keyword">{keyword.title -> f:format.htmlspecialchars()}</li>
            </f:for>
        </ul>
    </section>
</f:if>
</html>
