<html
        xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
        data-namespace-typo3-fluid="true"
>
<f:if condition="{venue.gastroMembers} || {venue.servesCuisineMembers} || {venue.seatsInside} || {venue.seatsOutside} || {venue.beerGarden} != '' || {venue.catering} != '' || {venue.deliveryService} != '' || {venue.hotCuisineThroughout} != '' || {venue.lateKitchen} != '' || {venue.selfService} != '' || {venue.takeAway} != '' || {venue.acceptsReservations} != '' || {venue.hasDriveThroughService} != ''">
    <section data-venue="gastronomy">
        <h3><f:translate key="content.meetingVenue.gastronomy" extensionName="thuecat" /></h3>
        <dl>
            <f:render partial="TouristAttraction/Venue/Fact/Members" arguments="{label: 'content.meetingVenue.gastro', prefix: 'content.gastro', members: venue.gastroMembers}" />
            <f:render partial="TouristAttraction/Venue/Fact/Members" arguments="{label: 'content.meetingVenue.servesCuisine', prefix: 'content.serves_cuisine', members: venue.servesCuisineMembers}" />
            <f:render partial="TouristAttraction/Venue/Fact/Number" arguments="{label: 'content.meetingVenue.seatsInside', value: venue.seatsInside}" />
            <f:render partial="TouristAttraction/Venue/Fact/Number" arguments="{label: 'content.meetingVenue.seatsOutside', value: venue.seatsOutside}" />
            <f:render partial="TouristAttraction/Venue/Fact/TriState" arguments="{label: 'content.meetingVenue.beerGarden', value: venue.beerGarden}" />
            <f:render partial="TouristAttraction/Venue/Fact/TriState" arguments="{label: 'content.meetingVenue.catering', value: venue.catering}" />
            <f:render partial="TouristAttraction/Venue/Fact/TriState" arguments="{label: 'content.meetingVenue.deliveryService', value: venue.deliveryService}" />
            <f:render partial="TouristAttraction/Venue/Fact/TriState" arguments="{label: 'content.meetingVenue.hotCuisineThroughout', value: venue.hotCuisineThroughout}" />
            <f:render partial="TouristAttraction/Venue/Fact/TriState" arguments="{label: 'content.meetingVenue.lateKitchen', value: venue.lateKitchen}" />
            <f:render partial="TouristAttraction/Venue/Fact/TriState" arguments="{label: 'content.meetingVenue.selfService', value: venue.selfService}" />
            <f:render partial="TouristAttraction/Venue/Fact/TriState" arguments="{label: 'content.meetingVenue.takeAway', value: venue.takeAway}" />
            <f:render partial="TouristAttraction/Venue/Fact/TriState" arguments="{label: 'content.meetingVenue.acceptsReservations', value: venue.acceptsReservations}" />
            <f:render partial="TouristAttraction/Venue/Fact/TriState" arguments="{label: 'content.meetingVenue.hasDriveThroughService', value: venue.hasDriveThroughService}" />
        </dl>
    </section>
</f:if>
</html>
