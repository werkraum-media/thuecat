<html
        xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
        data-namespace-typo3-fluid="true"
>
<f:if condition="{members}">
    <dt><f:translate key="{label}" extensionName="thuecat" /></dt>
    <dd>
        <ul>
            <f:for each="{members}" as="member">
                <li><f:translate key="{prefix}.{member}" extensionName="thuecat" default="{member}" /></li>
            </f:for>
        </ul>
    </dd>
</f:if>
</html>
