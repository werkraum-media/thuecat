<html
        xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
        data-namespace-typo3-fluid="true"
>
<f:if condition="{venue.logo} || {venue.subjectOfMedia -> f:count()}">
    <section data-venue="media">
        <h3><f:translate key="content.meetingVenue.media" extensionName="thuecat" /></h3>
        <f:if condition="{venue.logo}">
            <f:render partial="Media/Figure" arguments="{image: venue.logo}" />
        </f:if>
        <f:for each="{venue.subjectOfMedia}" as="image">
            <f:render partial="Media/Figure" arguments="{image: image}" />
        </f:for>
    </section>
</f:if>
</html>
