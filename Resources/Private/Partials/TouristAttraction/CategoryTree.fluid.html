<html
        xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
        data-namespace-typo3-fluid="true"
>
<f:comment>
    Renders itself per level; sys_category nesting is not depth-capped.
    {property} names the demand property the checkboxes bind to, so the same
    partial serves the category and keyword trees.
</f:comment>
<ul>
    <f:for each="{nodes}" as="node">
        <li>
            <label>
                <f:form.checkbox property="{property}" value="{node.category.uid}" multiple="1" />
                {node.category.title}
            </label>
            <f:if condition="{node.children}">
                <f:render partial="TouristAttraction/CategoryTree" arguments="{nodes: node.children, nested: 1, property: property}" />
            </f:if>
        </li>
    </f:for>
</ul>
</html>
