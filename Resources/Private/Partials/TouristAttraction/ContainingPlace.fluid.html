<html
        xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
        data-namespace-typo3-fluid="true"
>
<f:comment>A summary: a containing place is a record of its own, rendered in full on its own page.</f:comment>
<article class="place">
    <span class="place">{place.title -> f:format.htmlspecialchars()}</span>
    <f:if condition="{place.description}">
        <p>{place.description -> f:format.htmlspecialchars() -> f:format.nl2br()}</p>
    </f:if>
    <f:render partial="Address/Full" arguments="{address: place.firstAddress}" />
    <f:if condition="{place.hostsEvents -> f:count()}">
        <dl>
            <dt><f:translate key="content.hostsEvents" extensionName="thuecat" /></dt>
            <f:for each="{place.hostsEvents}" as="event">
                <dd class="event">{event.title -> f:format.htmlspecialchars()}</dd>
            </f:for>
        </dl>
    </f:if>
</article>
</html>
