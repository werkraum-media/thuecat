<html
        xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
        data-namespace-typo3-fluid="true"
>
<f:if condition="{address}">
    <address>
        <f:if condition="{address.street}"><span class="street">{address.street -> f:format.htmlspecialchars()}</span></f:if>
        <f:if condition="{address.zip}"><span class="zip">{address.zip -> f:format.htmlspecialchars()}</span></f:if>
        <f:if condition="{address.city}"><span class="city">{address.city -> f:format.htmlspecialchars()}</span></f:if>
    </address>
</f:if>
</html>
