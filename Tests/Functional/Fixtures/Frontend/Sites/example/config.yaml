base: /
imports:
  - { resource: 'EXT:thuecat/Configuration/Routes/TouristAttractionShow.yaml' }
  - { resource: 'EXT:thuecat/Configuration/Routes/TouristAttractionList.yaml' }
  - { resource: 'EXT:thuecat/Configuration/Routes/TrailShow.yaml' }
languages:
  -
    title: Deutsch
    enabled: true
    base: /
    typo3Language: de
    locale: de_DE.UTF-8
    iso-639-1: de
    navigationTitle: Deutsch
    hreflang: de-DE
    direction: ''
    flag: de
    websiteTitle: ''
    languageId: 0
  -
    title: English
    enabled: true
    base: /en
    typo3Language: default
    locale: en_GB.UTF-8
    iso-639-1: en
    websiteTitle: ''
    navigationTitle: English
    hreflang: en-GB
    direction: ''
    flag: gb
    languageId: 1
    fallbackType: strict
    fallbacks: '0'
  -
    title: French
    enabled: true
    base: /fr/
    typo3Language: fr
    locale: fr_FR.ytf8
    iso-639-1: fr
    websiteTitle: ''
    navigationTitle: ''
    hreflang: fr-FR
    direction: ''
    fallbackType: strict
    fallbacks: '1,0'
    flag: fr
    languageId: 2
rootPageId: 1
websiteTitle: 'Example Website'
settings:
  # Trails name no show page, so their sitemap stays empty.
  thuecat:
    pois:
      pid_show: 10
  import:
    thuecat:
      # The anchors the frontend filters resolve against. Fixtures place their
      # category tree under 300 and their keyword tree under 500, both stored
      # in the attraction storage folder (11).
      #
      # Each anchor must be a complete pair: the import validator treats a
      # parent without a storagePid as a misconfiguration, and only both-zero
      # as "mapping off". The frontend reads the parent alone.
      category:
        parent: 300
        storagePid: 11
      keywords:
        parent: 500
        storagePid: 11
